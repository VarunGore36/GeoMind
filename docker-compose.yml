services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: geomind
      POSTGRES_PASSWORD: geomind
      POSTGRES_DB: geomind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geomind -d geomind"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      GEOMIND_DATABASE_URL: postgresql+asyncpg://geomind:geomind@db:5432/geomind
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
