services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: geomind
      POSTGRES_PASSWORD: geomind
      POSTGRES_DB: geomind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geomind -d geomind"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

  api:
    build: .
    environment:
      GEOMIND_DATABASE_URL: postgresql+asyncpg://geomind:geomind@db:5432/geomind
      GEOMIND_CAM_REDIS__URL: redis://redis:6379/0
      GEOMIND_CAM_REDIS__ENABLED: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./frames:/app/frames
      - ./cameras.yaml:/app/cameras.yaml:ro

volumes:
  pgdata:
  redis_data:
