[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geomind-client"
version = "0.1.0"
description = "Python client library for GeoMind Location Intelligence API"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "GeoMind Team", email = "team@geomind.example.com"}
]
keywords = ["geomind", "geospatial", "location-intelligence", "wildfire", "api-client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
async = [
    "httpx[async]>=0.27",
]

[project.urls]
Homepage = "https://github.com/VarunGore36/GeoMind"
Repository = "https://github.com/VarunGore36/GeoMind"
Issues = "https://github.com/VarunGore36/GeoMind/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["geomind_client*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "W", "UP", "B", "C4", "PTH", "T20"]
ignore = ["E501", "B008"]
extend-select = ["ANN", "ARG", "ERA", "PD", "PL", "PT", "RET", "SIM", "TCH", "TRY"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true