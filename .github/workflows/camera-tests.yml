name: Camera Pipeline Tests

on:
  push:
    paths:
      - 'src/geomind/cameras/**'
      - 'tests/test_cameras*'
      - 'cameras.yaml*'
  pull_request:
    paths:
      - 'src/geomind/cameras/**'
      - 'tests/test_cameras*'
      - 'cameras.yaml*'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run camera tests
        run: |
          pytest tests/test_cameras.py tests/test_cameras_db.py tests/test_cameras_api.py tests/test_cameras_scheduler.py -v --cov=src/geomind/cameras --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false